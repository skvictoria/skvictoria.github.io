<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <marker id="h-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b5fc0"/></marker>
    <marker id="h-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e07a2a"/></marker>
    <marker id="h-gray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="h-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d55"/></marker>
  </defs>

  <!-- representation sphere -->
  <circle cx="60" cy="60" r="52" fill="#fbfbfb" stroke="#cfcfcf" stroke-width="1.5"/>
  <ellipse cx="60" cy="60" rx="52" ry="17" fill="none" stroke="#e2e2e2" stroke-width="1"/>
  <ellipse cx="60" cy="60" rx="20" ry="52" fill="none" stroke="#e2e2e2" stroke-width="1"/>

  <!-- vision and text subspaces -->
  <ellipse cx="60" cy="64" rx="45" ry="15" transform="rotate(-16 60 64)" fill="#4a8fdc" fill-opacity="0.18" stroke="#4a8fdc" stroke-width="1.5"/>
  <ellipse cx="60" cy="64" rx="45" ry="12" transform="rotate(14 60 64)" fill="#e98a3c" fill-opacity="0.18" stroke="#e98a3c" stroke-width="1.5"/>

  <!-- redundant, text-unique, synergy -->
  <line x1="60" y1="64" x2="96" y2="70" stroke="#555" stroke-width="5" stroke-linecap="round" marker-end="url(#h-gray)"/>
  <line x1="60" y1="64" x2="24" y2="56" stroke="#e07a2a" stroke-width="5" stroke-linecap="round" marker-end="url(#h-orange)"/>
  <line x1="60" y1="64" x2="47" y2="24" stroke="#1f9d55" stroke-width="5" stroke-linecap="round" marker-end="url(#h-green)"/>

  <!-- vision-unique: grows and thickens to show steering -->
  <line x1="60" y1="64" x2="78" y2="46" stroke="#1b5fc0" stroke-width="5" stroke-linecap="round" marker-end="url(#h-blue)">
    <animate attributeName="x2" values="78;92;92;78" keyTimes="0;0.4;0.8;1" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
    <animate attributeName="y2" values="46;32;32;46" keyTimes="0;0.4;0.8;1" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
    <animate attributeName="stroke-width" values="5;7;7;5" keyTimes="0;0.4;0.8;1" dur="3s" repeatCount="indefinite"/>
  </line>
  <circle cx="60" cy="64" r="3" fill="#333"/>
</svg>
