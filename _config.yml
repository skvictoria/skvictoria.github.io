title: Seulgi Kim
tagline: PhD Student at Georgia Tech
description: "Seulgi Kim is a Ph.D. student at Georgia Tech studying how to identify and selectively steer underutilized multimodal information in vision-language models."
url: https://skvictoria.github.io
baseurl: ""
# gems: [jekyll-paginate]
# paginate: 5

# Use of `relative_permalinks` ensures post links from the index work properly.
# permalink: "/:title"
# relative_permalinks: true

sass:
  sass_dir: _sass
  style: compressed

author:
  name: Seulgi Kim
  url: https://skvictoria.github.io/
  email: seulgi.kim@gatech.edu

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    default_lang: html
    css_class: 'syntax'

excerpt_separator: <!--more-->

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# Keep helper scripts out of the built site (listing exclude replaces Jekyll's defaults, so they are repeated here)
exclude:
  - scripts
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
